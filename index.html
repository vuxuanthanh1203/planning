<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nhật Ký Hẹn Hò</title>
<meta name="description" content="Nhật ký những buổi hẹn của chúng mình">
<meta property="og:type" content="website">
<meta property="og:title" content="Nhật Ký Hẹn Hò">
<meta property="og:description" content="Những buổi hẹn của chúng mình — mỗi lần gặp nhau là một trang được viết thêm">
<meta property="og:image" content="https://vuxuanthanh1203.github.io/planning/img/someli-p301.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
<style>
  :root{
    --paper:#faf6ee;
    --paper-2:#f4eee2;
    --ink:#221f1a;
    --muted:#8a8071;
    --rule:#e0d7c7;
    --accent:#8f3a48;
    --serif: ui-serif, Georgia, "Iowan Old Style", "Times New Roman", Times, serif;
    --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#15130f;
      --paper-2:#1e1b16;
      --ink:#ece4d6;
      --muted:#9c9284;
      --rule:#332e26;
      --accent:#d98a95;
    }
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--accent);color:var(--paper)}
  .wrap{max-width:680px;margin:0 auto;padding:0 24px}
  a{color:inherit}

  .label{
    font-family:var(--sans);font-size:10.5px;font-weight:600;
    letter-spacing:.28em;text-transform:uppercase;color:var(--muted);
  }
  .rule{height:1px;background:var(--rule);border:0;margin:0}

  /* ---------- Masthead ---------- */
  .masthead{padding:60px 0 0;text-align:center}
  .masthead .label{display:block;margin-bottom:20px}
  .masthead h1{
    font-family:var(--serif);font-weight:400;font-style:italic;
    font-size:clamp(38px,9vw,62px);line-height:1.06;margin:0;letter-spacing:-.015em;
  }
  .masthead .tagline{margin:16px 0 0;font-size:14px;color:var(--muted);font-family:var(--serif);font-style:italic}
  .dbl-rule{margin:34px 0 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);height:4px}

  /* ---------- Hub ---------- */
  .entries{padding:6px 0 0}
  .entry{
    display:block;text-decoration:none;color:inherit;
    padding:38px 0 40px;border-bottom:1px solid var(--rule);
  }
  .entry-top{display:flex;align-items:center;gap:14px;margin-bottom:16px}
  .entry-top .no{font-family:var(--serif);font-size:13px;letter-spacing:.16em;color:var(--accent);flex:none}
  .entry-top .line{flex:1;height:1px;background:var(--rule)}
  .entry-top .when{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);flex:none;font-weight:600}
  .entry h2{
    font-family:var(--serif);font-weight:400;font-size:clamp(27px,6vw,36px);
    line-height:1.15;margin:0;letter-spacing:-.015em;
  }
  .entry .meta{margin:10px 0 0;font-size:14px;color:var(--muted);font-family:var(--serif)}
  .cover{margin:22px 0 0;overflow:hidden;background:var(--paper-2);border:1px solid var(--rule)}
  .cover img{display:block;width:100%;height:auto;filter:saturate(.94)}
  .more{
    display:inline-block;margin:20px 0 0;font-size:12.5px;font-weight:600;
    letter-spacing:.1em;text-transform:uppercase;color:var(--accent);
    border-bottom:1px solid currentColor;padding-bottom:2px;
  }
  .entry:hover h2{color:var(--accent)}
  .entry:hover .cover img{filter:saturate(1)}
  .chip{
    display:inline-block;font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
    padding:3px 9px;border:1px solid var(--accent);color:var(--accent);margin-left:10px;vertical-align:2px;
  }
  .chip.past{border-color:var(--rule);color:var(--muted)}

  .closing{
    text-align:center;font-family:var(--serif);font-style:italic;
    color:var(--muted);font-size:15px;padding:46px 24px 0;
  }

  /* ---------- Detail ---------- */
  .back{
    display:inline-block;margin:38px 0 0;font-size:11px;font-weight:600;
    letter-spacing:.16em;text-transform:uppercase;color:var(--muted);text-decoration:none;
  }
  .back:hover{color:var(--accent)}
  .head{padding:26px 0 0}
  .head .no{font-family:var(--serif);font-size:13px;letter-spacing:.16em;color:var(--accent)}
  .head h1{
    font-family:var(--serif);font-weight:400;font-size:clamp(34px,8vw,50px);
    line-height:1.1;margin:12px 0 0;letter-spacing:-.02em;
  }
  .head .meta{margin:14px 0 0;font-family:var(--serif);font-size:15px;color:var(--muted)}
  .cd{
    margin:26px 0 0;padding:14px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
    display:flex;justify-content:space-between;align-items:baseline;gap:16px;
  }
  .cd .k{font-size:10.5px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
  .cd .v{font-family:var(--serif);font-size:19px;font-variant-numeric:tabular-nums;color:var(--accent)}

  .agenda{list-style:none;margin:0;padding:0}
  .item{
    display:grid;grid-template-columns:74px 1fr;gap:22px;
    padding:26px 0;border-bottom:1px solid var(--rule);
    opacity:0;transform:translateY(14px);transition:opacity .55s ease,transform .55s ease;
  }
  .item.in{opacity:1;transform:none}
  .item .hour{
    font-family:var(--serif);font-size:17px;font-variant-numeric:tabular-nums;
    color:var(--muted);padding-top:2px;letter-spacing:.01em;
  }
  .item h3{font-family:var(--serif);font-weight:400;font-size:23px;line-height:1.25;margin:0;letter-spacing:-.01em}
  .item.is-now .hour,.item.is-now h3{color:var(--accent)}
  .item.is-now{position:relative}
  .item.is-now::before{content:"";position:absolute;left:-16px;top:26px;bottom:26px;width:2px;background:var(--accent)}
  .item.is-past{opacity:.45}
  .item.is-past.in{opacity:.45}
  .nowtag{
    display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
    color:var(--paper);background:var(--accent);padding:2px 7px;margin-left:10px;vertical-align:3px;
  }

  .venue{margin:16px 0 0;font-size:14px;line-height:1.55}
  .venue b{font-weight:600}
  .venue span{display:block;color:var(--muted)}
  .venue a{
    display:inline-block;margin-top:7px;font-size:12px;font-weight:600;letter-spacing:.08em;
    text-transform:uppercase;color:var(--accent);text-decoration:none;border-bottom:1px solid currentColor;
  }
  .shot{margin:18px 0 0;border:1px solid var(--rule);background:var(--paper-2)}
  .shot img{display:block;width:100%;height:auto}
  .sub{
    list-style:none;margin:20px 0 2px;padding:0 0 0 18px;border-left:1px solid var(--rule);
    display:flex;flex-direction:column;gap:9px;
  }
  .sub li{display:flex;gap:14px;align-items:baseline;font-size:14px}
  .sub .t{flex:none;min-width:92px;color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}

  footer{
    text-align:center;padding:52px 0 64px;color:var(--muted);
    font-family:var(--serif);font-style:italic;font-size:14px;
  }
  footer .mark{display:block;font-style:normal;color:var(--accent);letter-spacing:.5em;margin-bottom:10px}

  @media (max-width:520px){
    .wrap{padding:0 20px}
    .item{grid-template-columns:62px 1fr;gap:16px}
    .item .hour{font-size:15px}
    .item h3{font-size:20px}
    .item.is-now::before{left:-12px}
    .sub li{flex-direction:column;gap:1px}
    .sub .t{min-width:0}
    .cd{flex-direction:column;gap:4px;align-items:flex-start}
  }
  @media (prefers-reduced-motion: reduce){
    .item{opacity:1;transform:none;transition:none}
  }
</style>
</head>
<body>

<div id="app"></div>

<script src="data.js"></script>
<script>
(function(){
  var app = document.getElementById('app');
  var DATES = (window.DATES || []).slice().sort(function(a,b){ return a.date < b.date ? 1 : -1; });
  var DOW = ['Chủ Nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];
  var timer = null;

  function esc(s){
    return String(s).replace(/[&<>"]/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
    });
  }
  function pad(n){ return String(n).padStart(2,'0'); }
  function ts(d, hhmm){ return new Date(d + 'T' + hhmm + ':00').getTime(); }
  function parts(d){ var p = d.split('-'); return {y:+p[0], m:+p[1], day:+p[2]}; }
  function dow(d){ var p = parts(d); return DOW[new Date(p.y, p.m-1, p.day).getDay()]; }
  function pretty(d){ var p = parts(d); return pad(p.day) + '.' + pad(p.m) + '.' + p.y; }
  function startOf(e){ return ts(e.date, e.schedule[0].time); }
  function endOf(e){
    var last = e.schedule[e.schedule.length-1];
    return ts(e.date, last.end || last.time);
  }
  function state(e){
    var now = Date.now();
    if(now < startOf(e)) return 'upcoming';
    if(now > endOf(e)) return 'past';
    return 'today';
  }

  /* ---------------- Trang bìa: danh sách các buổi hẹn ---------------- */
  function renderHub(){
    var items = DATES.map(function(e){
      var st = state(e);
      var chip = st === 'today' ? '<span class="chip">đang diễn ra</span>'
               : st === 'upcoming' ? '<span class="chip">sắp tới</span>'
               : '<span class="chip past">đã qua</span>';
      return '' +
      '<a class="entry" href="#/' + e.id + '">' +
        '<div class="entry-top">' +
          '<span class="no">№ ' + pad(e.no) + '</span>' +
          '<span class="line"></span>' +
          '<span class="when">' + pretty(e.date) + '</span>' +
        '</div>' +
        '<h2>' + esc(e.title) + chip + '</h2>' +
        '<p class="meta">' + dow(e.date) + ' · ' + esc(e.place) + ' · ' + esc(e.range) + '</p>' +
        (e.cover ? '<div class="cover"><img src="' + e.cover + '" alt="" loading="lazy"></div>' : '') +
        '<span class="more">Xem chi tiết →</span>' +
      '</a>';
    }).join('');

    app.innerHTML = '' +
      '<div class="wrap">' +
        '<header class="masthead">' +
          '<span class="label">Nhật ký</span>' +
          '<h1>Những Buổi Hẹn<br>Của Chúng Mình</h1>' +
          '<p class="tagline">mỗi lần gặp nhau là một trang được viết thêm</p>' +
          '<div class="dbl-rule"></div>' +
        '</header>' +
        '<main class="entries">' + items + '</main>' +
        '<p class="closing">…và còn nhiều trang nữa đang chờ được viết.</p>' +
      '</div>' +
      '<footer><span class="mark">♥</span>Viết cho em</footer>';

    document.title = 'Nhật Ký Hẹn Hò';
  }

  /* ---------------- Trang chi tiết một buổi hẹn ---------------- */
  function renderEntry(e){
    var rows = e.schedule.map(function(s){
      var venue = s.venue ? '' +
        '<p class="venue">' +
          '<b>' + esc(s.venue.name) + '</b>' +
          '<span>' + esc(s.venue.address) + '</span>' +
          (s.venue.map ? '<a href="' + s.venue.map + '" target="_blank" rel="noopener">Xem bản đồ →</a>' : '') +
        '</p>' : '';
      var shot = s.photo ? '<div class="shot"><img src="' + s.photo + '" alt="' + esc(s.photoAlt || '') + '" loading="lazy"></div>' : '';
      var sub = s.sub ? '<ul class="sub">' + s.sub.map(function(x){
        return '<li><span class="t">' + esc(x.time) + '</span><span>' + esc(x.title) + '</span></li>';
      }).join('') + '</ul>' : '';

      return '' +
      '<li class="item" data-start="' + s.time + '" data-end="' + (s.end || s.time) + '">' +
        '<div class="hour">' + esc(s.time) + '</div>' +
        '<div class="what"><h3>' + esc(s.title) + '</h3>' + venue + shot + sub + '</div>' +
      '</li>';
    }).join('');

    app.innerHTML = '' +
      '<div class="wrap">' +
        '<a class="back" href="#/">← Nhật ký</a>' +
        '<header class="head">' +
          '<div class="no">№ ' + pad(e.no) + '</div>' +
          '<h1>' + esc(e.title) + '</h1>' +
          '<p class="meta">' + dow(e.date) + ' · ' + pretty(e.date) + ' — ' + esc(e.place) + ' · ' + esc(e.range) + '</p>' +
          '<div class="cd"><span class="k" id="cd-k">Đếm ngược</span><span class="v" id="cd-v">—</span></div>' +
        '</header>' +
        '<main><ol class="agenda">' + rows + '</ol></main>' +
      '</div>' +
      '<footer><span class="mark">♥</span>Viết cho em</footer>';

    document.title = e.title + ' — Nhật Ký Hẹn Hò';
    startClock(e);
    reveal();
  }

  /* ---------------- Đồng hồ: đếm ngược + mốc đang diễn ra ---------------- */
  function startClock(e){
    var items = [].slice.call(document.querySelectorAll('.item'));
    var kEl = document.getElementById('cd-k'), vEl = document.getElementById('cd-v');
    var start = startOf(e), end = endOf(e);

    function tick(){
      var now = Date.now(), diff = start - now;
      if(diff > 0){
        var s = Math.floor(diff/1000);
        var d = Math.floor(s/86400);
        kEl.textContent = 'Còn lại';
        vEl.textContent = (d > 0 ? d + ' ngày ' : '') +
          pad(Math.floor(s%86400/3600)) + ':' + pad(Math.floor(s%3600/60)) + ':' + pad(s%60);
      } else if(now <= end){
        kEl.textContent = 'Hôm nay';
        vEl.textContent = 'đang diễn ra ♥';
      } else {
        kEl.textContent = 'Đã qua';
        vEl.textContent = 'một ngày thật đẹp';
      }

      items.forEach(function(el){
        var a = ts(e.date, el.dataset.start), b = ts(e.date, el.dataset.end);
        el.classList.remove('is-now','is-past');
        var tag = el.querySelector('.nowtag');
        if(tag) tag.remove();
        if(now >= b) el.classList.add('is-past');
        else if(now >= a){
          el.classList.add('is-now');
          var t = document.createElement('span');
          t.className = 'nowtag';
          t.textContent = 'bây giờ';
          el.querySelector('h3').appendChild(t);
        }
      });
    }
    tick();
    timer = setInterval(tick, 1000);
  }

  function reveal(){
    var items = [].slice.call(document.querySelectorAll('.item'));
    if(!('IntersectionObserver' in window)){
      items.forEach(function(i){ i.classList.add('in'); });
      return;
    }
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if(en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); }
      });
    }, {threshold:.12, rootMargin:'0px 0px -30px 0px'});
    items.forEach(function(i){ io.observe(i); });
  }

  /* ---------------- Điều hướng ---------------- */
  function route(){
    if(timer){ clearInterval(timer); timer = null; }
    var id = (location.hash || '').replace(/^#\/?/, '');
    var entry = DATES.filter(function(e){ return e.id === id; })[0];
    if(entry) renderEntry(entry); else renderHub();
    window.scrollTo(0,0);
  }

  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
